services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  maintenance:
    build: .
    command: ["python", "maintenance.py"]
    env_file: .env
    restart: unless-stopped
    volumes:
      - data:/data
      - backups:/backups
    networks: [internal]
    depends_on:
      app:
        condition: service_healthy
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on:
      app:
        condition: service_healthy
networks:
  internal:
volumes:
  data:
  backups:
  caddy_data:
  caddy_config:
